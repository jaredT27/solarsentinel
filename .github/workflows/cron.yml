# Solar Sentinel Enhanced — Daily Interconnection Queue Monitor
#
# Runs every day at 12:00 UTC (7 AM ET / 6 AM CT).
# Can also be triggered manually from the Actions tab.
#
# Snapshots in data/ are committed back to the repo after each run
# so that the next run can diff against the previous state.
# Log files are NOT committed (they stay on the runner).

name: Solar Sentinel Enhanced Daily Scan

on:
  schedule:
    # Every day at noon UTC
    - cron: "0 12 * * *"
  workflow_dispatch:
    # Allow manual trigger from the Actions tab
    inputs:
      force:
        description: "Treat all projects as new (--force)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write   # Needed to commit snapshot updates

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Check out the repo (with snapshot history) ──────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Python ───────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Cache pip dependencies ──────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 5. Verify reliability and filtering logic ──────────────
      - name: Run unit tests
        run: python -m pytest -q

      # ── 6. Run Solar Sentinel Enhanced ─────────────────────────
      - name: Run Solar Sentinel Enhanced
        id: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          SCAN_STARTED=$(date -u +%s)
          echo "started_at=$SCAN_STARTED" >> "$GITHUB_OUTPUT"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          # Monitor-only until paying subscribers are onboarded. This keeps
          # snapshots, diffs, history, and market health current without
          # delivering customer alerts or calling geocoding services.
          python solar_sentinel_enhanced.py --dry-run $FORCE_FLAG
          SCAN_EXIT=$?
          echo "exit_code=$SCAN_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      # ── 7. Commit validated snapshots, health, and history ─────
      # This ensures the next run can diff against today's data.
      - name: Commit snapshot updates
        run: |
          git config user.name "Solar Sentinel Bot"
          git config user.email "solar-sentinel[bot]@users.noreply.github.com"
          git add data/
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: update queue snapshots $(date -u +%Y-%m-%d)"
          git push

      # ── 8. Fail on actionable outages, not the known NYISO CDN issue ──
      - name: Enforce market health policy
        if: always()
        run: >-
          python scripts/enforce_scan_health.py
          --scan-exit "${{ steps.scan.outputs.exit_code }}"
          --started-at "${{ steps.scan.outputs.started_at }}"
          --allow-nyiso-degraded
